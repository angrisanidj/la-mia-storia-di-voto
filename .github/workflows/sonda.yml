# Scarica alcune pagine e le restituisce come artefatto: serve a studiare una fonte prima di scriverne il programma.
name: Sonda
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Indirizzi separati da spazi"
        required: true
      ramo:
        description: "Nome del ramo su cui salvare (sonda-NOME)"
        required: false
        default: "base"
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir sonda; i=0
          for u in $URLS; do
            i=$((i+1)); n=$(printf "%03d" $i)
            echo "$n $u" >> sonda/indice.txt
            curl -sSL -m 60 -A "la-mia-storia-di-voto (github.com/angrisanidj/la-mia-storia-di-voto)" -o "sonda/$n" -w "$n %{http_code} %{content_type} %{size_download}\n" "$u" >> sonda/esiti.txt || echo "$n errore" >> sonda/esiti.txt
            sleep 2
          done
          cat sonda/esiti.txt
      - name: Salva sul ramo «sonda-NOME» (non tocca il sito)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd sonda
          git init -q -b sonda-${{ inputs.ramo }}
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "Sonda ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" sonda-${{ inputs.ramo }}
